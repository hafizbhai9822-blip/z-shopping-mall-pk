
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z Shopping Mall Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
body { background:#f1f3f6; padding:20px; }
.box { background:white; padding:20px; margin:20px auto; max-width:1000px; border-radius:10px; }
input, textarea, select { width:100%; padding:12px; margin:8px 0; box-sizing:border-box; }
button { background:#14213d; color:white; padding:12px; border:0; border-radius:5px; cursor:pointer; margin:5px; }
button:disabled { opacity:.6; cursor:not-allowed; }
.delete { background:#c62828; }
.item { border-bottom:1px solid #ddd; padding:15px; }
.order-products { background:#f5f7fa; padding:12px; border-radius:8px; margin:10px 0; }
.order-product { padding:8px 0; border-bottom:1px solid #ddd; }
#dashboard { display:none; }
.chat-message { padding:12px; margin:8px 0; border-radius:10px; overflow-wrap:anywhere; }
.chat-from-customer { background:#e9f1ff; }
.chat-from-admin { background:#d9fdd3; }
#chat-conversation { max-height:400px; overflow-y:auto; background:#f5f5f5; padding:10px; border-radius:8px; }
#imagePreview { display:none; max-width:220px; max-height:220px; object-fit:contain; margin:10px 0; border-radius:8px; }
</style>
</head>

<body>

<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="message"></p>
</div>

<div id="dashboard">

<div class="box">
<h1>Admin Dashboard</h1>
<button onclick="logout()">Logout</button>
</div>

<div class="box">
<h2>💬 Customer Chats</h2>
<button onclick="loadChats()">Refresh Chats</button>
<div id="chatList">Loading chats...</div>

<div id="chatReplyBox" style="display:none;">
<hr>
<h3 id="chatCustomerTitle"></h3>
<div id="chat-conversation"></div>
<textarea id="chatReplyText" placeholder="Write your reply..."></textarea>
<button onclick="sendAdminReply()">Send Reply</button>
<p id="chatReplyMessage"></p>
</div>
</div>

<div class="box">
<h2>Add Product</h2>

<input id="pname" placeholder="Product Name">
<textarea id="pdesc" placeholder="Product Description"></textarea>
<input id="pprice" type="number" placeholder="Price (Rs.)">
<input id="pstock" type="number" placeholder="Stock Quantity">

<label><strong>Choose Product Image</strong></label>
<input id="pimageFile" type="file" accept="image/*">
<img id="imagePreview" alt="Image Preview">
<p id="imageMessage">Select an image from your computer.</p>

<select id="pcategory">
<option value="">Select Category</option>
</select>

<button id="addProductButton" onclick="addProduct()">Add Product</button>
<p id="productMessage"></p>
</div>

<div class="box">
<h2>Products</h2>
<div id="productList">Loading...</div>
</div>

<div class="box">
<h2>Orders</h2>
<div id="orderList">Loading...</div>
</div>

</div>

<script>
let activeChatPhone = "";
let activeChatName = "";
let activeChatKey = "";
let chatConversations = [];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

// IMAGE PREVIEW
document.getElementById("pimageFile").addEventListener("change", function() {
  const file = this.files[0];
  const preview = document.getElementById("imagePreview");
  const message = document.getElementById("imageMessage");

  if (!file) {
    preview.style.display = "none";
    message.innerText = "Select an image from your computer.";
    return;
  }

  if (!file.type.startsWith("image/")) {
    this.value = "";
    preview.style.display = "none";
    message.innerText = "Please select an image file.";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    this.value = "";
    preview.style.display = "none";
    message.innerText = "Image must be smaller than 5 MB.";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  message.innerText = file.name;
});

// LOGIN
async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.innerText = "Checking...";

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email, password
    });

    if (error) {
      message.innerText = error.message;
      return;
    }

    const { data: admin, error: adminError } = await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.user.id)
      .maybeSingle();

    if (adminError || !admin) {
      await supabaseClient.auth.signOut();
      message.innerText = adminError
        ? adminError.message
        : "Admin permission not found.";
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    loadCategories();
    loadProducts();
    loadOrders();
    loadChats();

  } catch (error) {
    message.innerText = error.message;
  }
}

async function logout() {
  await supabaseClient.auth.signOut();
  location.reload();
}

// CUSTOMER CHATS
async function loadChats() {
  const list = document.getElementById("chatList");
  list.innerText = "Loading chats...";

  const { data, error } = await supabaseClient
    .from("chats")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    list.innerText = "Chats could not load: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = "<p>No messages yet.</p>";
    return;
  }

  const conversations = {};

  data.forEach(msg => {
    if (!msg.chat_key) return;

    const key = msg.chat_key;

    if (!conversations[key]) {
      conversations[key] = {
        key,
        phone: msg.phone,
        name: msg.customer_name,
        lastMessage: msg.message,
        date: msg.created_at
      };
    }
  });

  chatConversations = Object.values(conversations);

  if (!chatConversations.length) {
    list.innerHTML = "<p>No new chats yet.</p>";
    return;
  }

  list.innerHTML = chatConversations.map((c, index) => `
    <div class="item">
      <strong>${escapeHTML(c.name)}</strong>
      <p>📱 ${escapeHTML(c.phone)}</p>
      <p>${escapeHTML(c.lastMessage)}</p>
      <button onclick="openChat(${index})">Open Chat</button>
    </div>
  `).join("");
}

async function openChat(index) {
  const conversation = chatConversations[index];
  if (!conversation) return;

  activeChatPhone = conversation.phone;
  activeChatName = conversation.name;
  activeChatKey = conversation.key;

  document.getElementById("chatReplyBox").style.display = "block";
  document.getElementById("chatCustomerTitle").textContent =
    "Chat with " + activeChatName + " (" + activeChatPhone + ")";
  document.getElementById("chatReplyMessage").innerText = "";

  await refreshConversation();

  document.getElementById("chatReplyBox").scrollIntoView({
    behavior: "smooth"
  });
}

async function refreshConversation() {
  const box = document.getElementById("chat-conversation");

  if (!activeChatPhone || !activeChatKey) return;

  const { data, error } = await supabaseClient
    .from("chats")
    .select("*")
    .eq("phone", activeChatPhone)
    .eq("chat_key", activeChatKey)
    .order("created_at", { ascending: true });

  if (error) {
    box.innerText = error.message;
    return;
  }

  box.innerHTML = "";

  if (!data || !data.length) {
    box.innerText = "No messages in this conversation.";
    return;
  }

  data.forEach(msg => {
    const div = document.createElement("div");

    div.className = "chat-message " +
      (msg.sender === "customer" ? "chat-from-customer" : "chat-from-admin");

    div.textContent =
      (msg.sender === "customer" ? "Customer: " : "Admin: ") +
      msg.message;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

async function sendAdminReply() {
  const message = document.getElementById("chatReplyText").value.trim();
  const result = document.getElementById("chatReplyMessage");

  if (!message || !activeChatPhone || !activeChatKey) {
    result.innerText = "Write a message first.";
    return;
  }

  result.innerText = "Sending...";

  const { error } = await supabaseClient
    .from("chats")
    .insert([{
      customer_name: activeChatName,
      phone: activeChatPhone,
      message,
      sender: "admin",
      chat_key: activeChatKey
    }]);

  if (error) {
    result.innerText = error.message;
    return;
  }

  document.getElementById("chatReplyText").value = "";
  result.innerText = "Reply sent!";

  await refreshConversation();
  await loadChats();
}

// CATEGORIES
async function loadCategories() {
  const { data, error } = await supabaseClient
    .from("categories")
    .select("id,name")
    .eq("is_active", true);

  if (error) {
    document.getElementById("productMessage").innerText = error.message;
    return;
  }

  const select = document.getElementById("pcategory");
  select.innerHTML = '<option value="">Select Category</option>';

  (data || []).forEach(category => {
    const option = document.createElement("option");
    option.value = category.id;
    option.textContent = category.name;
    select.appendChild(option);
  });
}

// UPLOAD IMAGE TO SUPABASE STORAGE
async function uploadProductImage(file) {
  const extension = file.name.split(".").pop().toLowerCase();
  const fileName = Date.now() + "-" +
    Math.random().toString(36).slice(2) + "." + extension;

  const filePath = fileName;

  const { error } = await supabaseClient.storage
    .from("product-images")
    .upload(filePath, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data } = supabaseClient.storage
    .from("product-images")
    .getPublicUrl(filePath);

  return data.publicUrl;
}

// ADD PRODUCT
async function addProduct() {
  const name = document.getElementById("pname").value.trim();
  const description = document.getElementById("pdesc").value.trim();
  const price = Number(document.getElementById("pprice").value);
  const stock = Number(document.getElementById("pstock").value);
  const file = document.getElementById("pimageFile").files[0];
  const category = document.getElementById("pcategory").value;
  const message = document.getElementById("productMessage");
  const button = document.getElementById("addProductButton");

  if (!name || document.getElementById("pprice").value === "" ||
      !Number.isFinite(price) || price < 0 ||
      document.getElementById("pstock").value === "" ||
      !Number.isInteger(stock) || stock < 0) {
    message.innerText = "Please enter a valid name, price and stock.";
    return;
  }

  if (!file) {
    message.innerText = "Please choose a product image.";
    return;
  }

  if (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024) {
    message.innerText = "Choose a valid image smaller than 5 MB.";
    return;
  }

  button.disabled = true;
  message.innerText = "Uploading image...";

  try {
    const imageUrl = await uploadProductImage(file);

    message.innerText = "Saving product...";

    const { error } = await supabaseClient.from("products").insert({
      name,
      description,
      price,
      stock,
      image_url: imageUrl,
      category_id: category ? Number(category) : null,
      is_active: true
    });

    if (error) throw error;

    message.innerText = "Product and image added successfully!";

    ["pname", "pdesc", "pprice", "pstock", "pimageFile", "pcategory"]
      .forEach(id => {
        document.getElementById(id).value = "";
      });

    document.getElementById("imagePreview").style.display = "none";
    document.getElementById("imageMessage").innerText =
      "Select an image from your computer.";

    await loadProducts();

  } catch (error) {
    message.innerText = "Error: " + error.message;
    console.error(error);
  } finally {
    button.disabled = false;
  }
}

// LOAD PRODUCTS
async function loadProducts() {
  const { data, error } = await supabaseClient
    .from("products")
    .select("id,name,price,stock,image_url,is_active,categories(name)")
    .order("created_at", { ascending: false });

  const list = document.getElementById("productList");

  if (error) {
    list.innerText = error.message;
    return;
  }

  if (!data || !data.length) {
    list.innerHTML = "<p>No products yet.</p>";
    return;
  }

  list.innerHTML = data.map(p => `
    <div class="item">
      ${p.image_url ? `<img src="${escapeHTML(p.image_url)}" alt="" style="width:100px;height:100px;object-fit:contain;">` : ""}
      <strong>${escapeHTML(p.name)}</strong>
      <p>Price: Rs. ${Number(p.price).toLocaleString()}</p>
      <p>Stock: ${p.stock}</p>
      <p>Category: ${escapeHTML(p.categories?.name || "None")}</p>
      <button class="delete" onclick="deleteProduct(${JSON.stringify(p.id)})">Delete</button>
    </div>
  `).join("");
}

async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;

  const { error } = await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadProducts();
}

// ORDERS
async function loadOrders() {
  const list = document.getElementById("orderList");
  list.innerText = "Loading orders...";

  const { data: orders, error } = await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    list.innerText = error.message;
    return;
  }

  if (!orders || !orders.length) {
    list.innerHTML = "<p>No orders yet.</p>";
    return;
  }

  const orderIds = orders.map(o => o.id);

  const { data: items, error: itemsError } = await supabaseClient
    .from("order_items")
    .select("order_id,product_name,quantity,unit_price,subtotal")
    .in("order_id", orderIds);

  if (itemsError) {
    list.innerText = "Order products could not load: " + itemsError.message;
    return;
  }

  list.innerHTML = orders.map(o => {
    const orderItems = (items || []).filter(item => item.order_id === o.id);

    return `
      <div class="item">
        <h3>Order: ${escapeHTML(o.order_number)}</h3>
        <p><strong>Customer:</strong> ${escapeHTML(o.customer_name)}</p>
        <p><strong>Phone:</strong> ${escapeHTML(o.phone)}</p>
        <p><strong>City:</strong> ${escapeHTML(o.city)}</p>
        <p><strong>Address:</strong> ${escapeHTML(o.address)}</p>

        <h4>Ordered Products</h4>
        <div class="order-products">
          ${orderItems.length ? orderItems.map(item => `
            <div class="order-product">
              <strong>${escapeHTML(item.product_name)}</strong>
              <p>Quantity: ${item.quantity}</p>
              <p>Price: Rs. ${Number(item.unit_price).toLocaleString()}</p>
              <p>Subtotal: Rs. ${Number(item.subtotal).toLocaleString()}</p>
            </div>
          `).join("") : "<p>No product details found.</p>"}
        </div>

        <h3>Total: Rs. ${Number(o.total).toLocaleString()}</h3>
        <p><strong>Payment Method:</strong> ${escapeHTML(o.payment_method)}</p>
        <p><strong>Payment Status:</strong> ${escapeHTML(o.payment_status || "pending")}</p>

        <label>Update Payment Status</label>
        <select id="payment-status-${o.id}">
          <option value="pending" ${o.payment_status === "pending" ? "selected" : ""}>Pending</option>
          <option value="paid" ${o.payment_status === "paid" ? "selected" : ""}>Paid</option>
        </select>
        <button onclick="updatePaymentStatus('${o.id}')">Update Payment</button>

        <p><strong>Order Status:</strong> ${escapeHTML(o.status)}</p>

        <label>Update Order Status</label>
        <select id="status-${o.id}">
          <option value="pending" ${o.status === "pending" ? "selected" : ""}>Pending</option>
          <option value="confirmed" ${o.status === "confirmed" ? "selected" : ""}>Confirmed</option>
          <option value="shipped" ${o.status === "shipped" ? "selected" : ""}>Shipped</option>
          <option value="delivered" ${o.status === "delivered" ? "selected" : ""}>Delivered</option>
          <option value="cancelled" ${o.status === "cancelled" ? "selected" : ""}>Cancelled</option>
        </select>
        <button onclick="updateOrder('${o.id}')">Update Status</button>

        <button class="delete" onclick="deleteOrder('${o.id}')">
          Delete Order
        </button>
      </div>
    `;
  }).join("");
}

// UPDATE PAYMENT STATUS
async function updatePaymentStatus(id) {
  const paymentStatus = document.getElementById("payment-status-" + id).value;

  const { error } = await supabaseClient
    .from("orders")
    .update({ payment_status: paymentStatus })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Payment status updated!");
  await loadOrders();
}

// UPDATE ORDER STATUS
async function updateOrder(id) {
  const status = document.getElementById("status-" + id).value;

  const { error } = await supabaseClient
    .from("orders")
    .update({ status })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Order status updated!");
  await loadOrders();
}

// DELETE ORDER - VERIFY ACTUAL DELETION
async function deleteOrder(id) {
  if (!confirm("Are you sure you want to permanently delete this order and its products?")) {
    return;
  }

  try {
    // Delete order items first and verify the result
    const { data: deletedItems, error: itemsError } = await supabaseClient
      .from("order_items")
      .delete()
      .eq("order_id", id)
      .select("order_id");

    if (itemsError) {
      alert("Could not delete order products: " + itemsError.message);
      console.error("Order items delete error:", itemsError);
      return;
    }

    // Delete the order and ask Supabase to return its ID
    const { data: deletedOrder, error: orderError } = await supabaseClient
      .from("orders")
      .delete()
      .eq("id", id)
      .select("id");

    if (orderError) {
      alert("Could not delete order: " + orderError.message);
      console.error("Order delete error:", orderError);
      return;
    }

    // A successful HTTP response can still delete zero rows
    if (!deletedOrder || deletedOrder.length === 0) {
      alert("Order was NOT deleted. Supabase returned zero deleted rows. Please check the DELETE policy.");
      console.error("No order deleted. Order ID:", id);
      return;
    }

    alert("Order deleted successfully!");
    await loadOrders();

  } catch (error) {
    alert("Unexpected error: " + error.message);
    console.error("Delete order exception:", error);
  }
}
</script>

</body>
</html>
